# Model registry — docs/BUILD_PLAN.md §4.
#
# Every model used anywhere in Atelier (on-device or backend) is tracked here
# with real, verified metadata. No placeholder values: an entry exists only
# once its fields have been checked against the model's actual repository.
#
# Required fields per entry:
#   name      — model identifier
#   github    — source repository URL
#   revision  — exact commit/tag verified
#   license   — SPDX identifier as published by the authors
#   weights   — real download URL for the weights
#   checksum  — SHA-256 of the downloaded weight file
#   runtime   — e.g. mediapipe, onnx, tflite, pytorch
#   task      — e.g. pose_landmarks, face_landmarks, embedding, vton
#   hardware  — e.g. cpu, gpu
#   installed — true only after Download → Verify → Install completed
#   tested    — true only after a real inference ran successfully
#   notes     — anything a future maintainer must know
models:
  - name: pose_landmarker_full
    github: https://github.com/google-ai-edge/mediapipe
    revision: float16/latest (published via gs://mediapipe-models/pose_landmarker)
    license: Apache-2.0
    weights: https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/latest/pose_landmarker_full.task
    checksum: 4eaa5eb7a98365221087693fcc286334cf0858e2eb6e15b506aa4a7ecdcec4ad
    runtime: mediapipe
    task: pose_landmarks
    hardware: cpu
    installed: true
    tested: true
    notes: >-
      33-point body skeleton, IMAGE mode, num_poses=2 so a second detected
      person becomes an honest MULTIPLE_PEOPLE failure instead of a silent
      pick. Downloaded 2026-08-14 and SHA-256 verified by the backend
      ModelManager into backend/.model_cache/ (gitignored). Tested Phase 1
      against real CC0 fixture photos. Weights served under the model assets
      terms of google-ai-edge/mediapipe (Apache-2.0).
  - name: face_landmarker
    github: https://github.com/google-ai-edge/mediapipe
    revision: float16/latest (published via gs://mediapipe-models/face_landmarker)
    license: Apache-2.0
    weights: https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task
    checksum: 64184e229b263107bc2b804c6625db1341ff2bb731874b0bcc2fe6544e0bc9ff
    runtime: mediapipe
    task: face_landmarks
    hardware: cpu
    installed: true
    tested: true
    notes: >-
      478-point face mesh including iris landmarks (468/473), IMAGE mode,
      num_faces=2 so a second face becomes MULTIPLE_PEOPLE. Downloaded
      2026-08-14 and SHA-256 verified by the backend ModelManager. Tested
      Phase 1 against a real CC0 portrait fixture.
# Deferred: person segmentation. No Phase 1 consumer needs it; it enters the
# registry with the same verification lifecycle when Wardrobe/Try-On does.
# Recorded in docs/MODEL_SETUP.md.
